name: CI and EC2 deployment

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    name: Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.16.0'
      - name: Install pinned package manager and dependencies
        run: |
          corepack enable
          pnpm install --frozen-lockfile
      - name: Deployment agent tests
        run: python3 -m unittest discover -s ops/tests -v
      - name: Unit and replica-set integration tests
        env:
          CI: 'true'
        run: |
          pnpm exec jest --runInBand
          pnpm exec jest --config test/jest-e2e.json --runInBand
          node --test test/*.test.mjs
          pnpm build

  publish:
    name: Publish immutable release
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    environment: production
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build tested production image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          target: production
          load: true
          tags: farm2fork-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Export immutable image
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: docker save "farm2fork-backend:$SOURCE_SHA" | gzip -1 > image.tar.gz
      - name: Prepare manifest
        run: python3 .github/scripts/publish-release.py backend --prepare
      - name: Sign artifact and manifest provenance
        id: provenance
        uses: actions/attest-build-provenance@96b4a1ef7235a096b17240c259729fdd70c83d45 # v2
        with:
          subject-path: |
            image.tar.gz
            manifest.json
      - name: Preserve signed bundle
        env:
          BUNDLE_PATH: ${{ steps.provenance.outputs.bundle-path }}
        run: cp "$BUNDLE_PATH" attestation.json
      - name: Publish complete release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: python3 .github/scripts/publish-release.py backend

  activate:
    name: Verify EC2 activation
    needs: publish
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Wait for EC2 readiness or rollback receipt
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: python3 .github/scripts/wait-for-deploy.py backend "$SOURCE_SHA"
